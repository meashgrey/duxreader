<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duxreader</title>
    <style>
      /* Firefox sizes the panel from body layout before the app has mounted.
         Keep this local: dev-mode module/CSS requests must not define its size. */
      html,
      body {
        width: 384px;
        min-height: 360px;
        margin: 0;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e1e2e9);
      }
      .popup-loading {
        min-height: 360px;
        box-sizing: border-box;
        padding: 32px 24px;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      .popup-loading h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- React replaces this shell after its dependency graph is ready. -->
      <div class="popup-loading" role="status" aria-live="polite">
        <h1>Duxreader</h1>
        <p>Loading…</p>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
