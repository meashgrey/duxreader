<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Duxreader · Preferences</title>
    <script type="module" src="../vimium/preferences.js"></script>
  </head>
  <body class="vimium-body preferences">
    <div id="root"></div>
    <template id="exclusion-rule-template"
      ><tr class="rule">
        <td>
          <input
            type="text"
            name="pattern"
            spellcheck="false"
            placeholder="URL pattern"
            aria-label="URL pattern"
          />
        </td>
        <td>
          <input
            type="text"
            name="passKeys"
            spellcheck="false"
            placeholder="All"
            aria-label="Keys to exclude"
          />
        </td>
        <td>
          <button type="button" class="remove" aria-label="Remove rule">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12Z"
              />
            </svg>
          </button>
        </td></tr
    ></template>
  </body>
</html>
