name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libwayland-dev
      - name: Validate version and tag
        id: release
        run: |
          version=$(bun -p 'require("./package.json").version')
          tag=$(git describe --tags --exact-match)
          test "$tag" = "v$version"
          test -f "releases/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - name: Run checks
        run: |
          bun run typecheck
          bun run test
          bun run test:bridge
          bun run test:bridge:integration
      - name: Build release packages
        run: bun run release:pack
      - name: Check Chromium extension behavior
        run: |
          bunx --bun playwright install --with-deps chromium
          bun run test:browser --browser chromium
          bun run test:preferences
          bun run test:vimium
      - name: Sign Firefox package when Mozilla credentials are available
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] && [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "No Mozilla credentials configured; publishing the unsigned Firefox test package."
            exit 0
          fi
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Configure both AMO_JWT_ISSUER and AMO_JWT_SECRET."
            exit 1
          fi
          bunx --bun web-ext sign --source-dir .output/firefox-mv2 --artifacts-dir .output/signed --channel unlisted --upload-source-code ".output/duxreader-$VERSION-sources.zip"
          signed=$(find .output/signed -maxdepth 1 -name '*.xpi' -print -quit)
          test -n "$signed"
          cp "$signed" ".output/release/$VERSION/duxreader-$VERSION-firefox-signed.xpi"
          bun scripts/package-release.mts --checksums-only
      - uses: actions/upload-artifact@v4
        with:
          name: duxreader-${{ steps.release.outputs.version }}
          path: .output/release/${{ steps.release.outputs.version }}/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .output/release/"$VERSION"/* --clobber
          else
            gh release create "$TAG" .output/release/"$VERSION"/* --verify-tag --title "Duxreader $VERSION" --notes-file "releases/$VERSION.md"
          fi
